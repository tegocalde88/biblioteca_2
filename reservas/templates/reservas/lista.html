<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libros Disponibles</title>
</head>
<body>
    <h1>Libros Disponibles</h1>
    <ul>
        {% for libro in libros %}
            <li>
                <strong>{{ libro.titulo }}</strong> - {{ libro.autor }}
                | <a href="{% url 'reservar_libro' libro.id %}">Reservar</a>
            </li>
        {% empty %}
            <li>No hay libros disponibles para reservar.</li>
        {% endfor %}
    </ul>
</body>
</html>
