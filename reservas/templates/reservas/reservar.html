<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservar Libro</title>
</head>
<body>
    <h1>Reservar: {{ libro.titulo }}</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="solicitante">Nombre del solicitante:</label>
        <input type="text" id="solicitante" name="solicitante" required>
        <button type="submit">Reservar Libro</button>
    </form>
    <br>
    <a href="{% url 'lista_libros' %}">Cancelar</a>
</body>
</html>
